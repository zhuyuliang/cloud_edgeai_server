<style>

  .nav.side-menu > li > a:hover span.fa-chevron-down,

  }

    border-left: none !important;

  .nav-md ul.nav.child_menu li:before,

  /* 全局覆盖 - 确保所有菜单文字颜色正确和无边框 */

  .nav.side-menu > li > a span,

  .nav.side-menu > li > a:hover span,

    border: none !important;

  .nav.side-menu > li.active > a,

  /* 子菜单悬停效果 */

    background: #f1f3f4 !important;

  }
  
  /* 覆盖 custom.css 中子菜单悬停的白色文字 */
  .nav.child_menu li li a:hover,
  .nav.child_menu li li a.active,
  .nav.child_menu li a:hover {

  }

  .nav.child_menu > li > a {

  .child_menu > li.active > a,
  .nav.child_menu li.active a {

    color: #2a80eb !important;
    font-weight: 500 !important;

    outline: none !important;
  }
  
  .nav.child_menu li li.active,
  .nav.child_menu li li:hover {

  }
  
  /* 确保激活的子菜单项文字颜色正确 */
  .nav.child_menu li.active > a,
  .nav.side-menu .child_menu li.active a {
    color: #2a80eb !important;
  }

  }

  .side-menu > li > a,
  .child_menu > li > a {

  }

  .side-menu > li > a::after,

    height: 0 !important;
    border-radius: 50% !important;

  .child_menu > li > a:active::after {

    height: 200px !important;

  /* 菜单分组分隔线 */

  .child_menu > li > a:focus-visible {

  }

  }
  
  /* 平滑滚动 */
  .scroll-view {
    scroll-behavior: smooth !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }
  
  /* Google Cloud Logo 动画 */

  }

  /* 加载动画 */
  @keyframes slideInFromLeft {

      opacity: 0;
      transform: translateX(-20px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
  
  .side-menu > li {

    animation-fill-mode: both !important;
  }
  
  .side-menu > li:nth-child(1) { animation-delay: 0.05s !important; }
  .side-menu > li:nth-child(2) { animation-delay: 0.1s !important; }
  .side-menu > li:nth-child(3) { animation-delay: 0.15s !important; }
  .side-menu > li:nth-child(4) { animation-delay: 0.2s !important; }
  .side-menu > li:nth-child(5) { animation-delay: 0.25s !important; }
  .side-menu > li:nth-child(6) { animation-delay: 0.3s !important; }
  .side-menu > li:nth-child(7) { animation-delay: 0.35s !important; }
  .side-menu > li:nth-child(8) { animation-delay: 0.4s !important; }
  
  /* 阴影效果 - 滚动时 */

  @media (prefers-contrast: high) {

    .child_menu > li > a {

    .child_menu > li > a:hover {

  /* 深色模式支持(未来扩展) */

</style>

        <li>
          <a href="/node/index" data-title="节点管理"><i class="fa fa-database"></i> <span>节点管理</span></a>
        </li>
        
        <li>
          <a data-title="报警管理"><i class="fa fa-bullhorn"></i> <span>报警管理</span> <span class="fa fa-chevron-down"></span></a>
          <ul class="nav child_menu">
            <li><a href="/alarm/event" data-title="事件告警">事件告警</a></li>
            <li><a href="/alarm/carplate" data-title="车牌告警">车牌告警</a></li>
            <li><a href="/alarm/face" data-title="人脸告警">人脸告警</a></li>
            <li><a href="/alarm/count" data-title="计数告警">计数告警</a></li>
          </ul>
        </li>
        
        <li>
          <a data-title="视频管理"><i class="fa fa-video-camera"></i> <span>视频管理</span> <span class="fa fa-chevron-down"></span></a>
          <ul class="nav child_menu">
            <li><a href="/stream/index">视频管理</a></li>
            <li><a href="/stream/player">单屏播放器</a></li>
          </ul>
        </li>
        
        <li>
          <a href="/control/index" data-title="布控管理"><i class="fa fa-cube"></i> <span>布控管理</span></a>
        </li>
        
        <li>
          <a href="/user/index" data-title="用户管理"><i class="fa fa-user"></i> <span>用户管理</span></a>
        </li>
        
        <li>
          <a data-title="系统功能"><i class="fa fa-gear"></i> <span>系统功能</span> <span class="fa fa-chevron-down"></span></a>
          <ul class="nav child_menu">
            <li><a href="/system/config">启动配置</a></li>
            <li><a href="/version/index">关于系统</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
  <!-- /侧边栏菜单 -->
</div>

<script>
(function() {
  'use strict';
  
  // 禁用 custom.js 中的侧边栏切换逻辑（nav-md/nav-sm状态切换）
  // 确保 body 始终保持 nav-md 状态，避免出现只显示图标的迷你侧边栏
  function disableOldSidebarLogic() {
    // 移除可能存在的 nav-sm 类，强制使用 nav-md
    document.body.classList.remove('nav-sm');
    document.body.classList.add('nav-md');
    
    // 如果 jQuery 可用，移除 custom.js 中绑定的所有相关事件
    if (typeof $ !== 'undefined') {
      // 移除汉堡菜单按钮的事件
      if ($('#menu_toggle').length > 0) {
        $('#menu_toggle').off('click');
      }
      
      // 移除侧边栏菜单所有链接的事件（custom.js 中绑定的）
      if ($('#sidebar-menu').length > 0) {
        $('#sidebar-menu').find('a').off('click');
        
        // 阻止 slideUp/slideDown 动画（custom.js使用的）
        $('#sidebar-menu').find('li ul').stop(true, true);
        
        // 移除 custom.js 可能添加的类
        $('#sidebar-menu').find('li').removeClass('active-sm');
      }
    }
    
    console.log('已禁用旧的侧边栏逻辑');
  }
  
  // 监听 body 类变化，防止被修改回 nav-sm
  function preventNavSmClass() {
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === 'class') {
          const body = mutation.target;
          if (body.classList.contains('nav-sm')) {
            body.classList.remove('nav-sm');
            body.classList.add('nav-md');
          }
        }
      });
    });
    
    observer.observe(document.body, {
      attributes: true,
      attributeFilter: ['class']
    });
  }
  
  // Google Cloud 风格菜单交互
  function initGoogleCloudMenu() {
    const menuItems = document.querySelectorAll('.side-menu > li');
    const currentPath = window.location.pathname;
    
    console.log('==== 开始初始化Google Cloud菜单 ====');
    console.log('找到菜单项数量:', menuItems.length);
    
    // 菜单项点击处理
    menuItems.forEach(function(item, index) {
      const link = item.querySelector('a');
      const hasSubmenu = item.querySelector('.child_menu');
      
      if (!link) return;
      
      // 移除旧的初始化标记，强制重新绑定
      if (item.hasAttribute('data-menu-initialized')) {
        item.removeAttribute('data-menu-initialized');
        console.log('菜单项', index, '移除旧标记，准备重新初始化');
      }
      
      console.log('菜单项', index, ':', link.textContent.trim(), hasSubmenu ? '(有子菜单)' : '(无子菜单)');
      
      item.setAttribute('data-menu-initialized', 'true');
      
      if (hasSubmenu) {
        // 有子菜单的项目
        // 完全替换link元素以移除所有旧的事件监听器
        const newLink = link.cloneNode(true);
        link.parentNode.replaceChild(newLink, link);
        
        // 创建新的处理函数
        const clickHandler = function(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          
          const isActive = item.classList.contains('active');
          
          console.log('点击有子菜单的项目:', newLink.textContent.trim(), '当前状态:', isActive);
          
          // 关闭其他展开的菜单项(带动画)
          menuItems.forEach(function(otherItem) {
            if (otherItem !== item && otherItem.classList.contains('active')) {
              otherItem.classList.remove('active');
            }
          });
          
          // 切换当前菜单项
          if (isActive) {
            item.classList.remove('active');
            console.log('关闭子菜单');
          } else {
            item.classList.add('active');
            console.log('展开子菜单');
            
            // 确保展开的菜单在可视区域内
            setTimeout(function() {
              const childMenu = item.querySelector('.child_menu');
              if (childMenu) {
                const rect = childMenu.getBoundingClientRect();
                const scrollView = document.querySelector('.scroll-view');
                
                if (rect.bottom > window.innerHeight && scrollView) {
                  scrollView.scrollTo({
                    top: scrollView.scrollTop + (rect.bottom - window.innerHeight) + 20,
                    behavior: 'smooth'
                  });
                }
              }
            }, 100);
          }
          
          return false;
        };
        
        // 添加新的事件监听器，使用捕获阶段（优先级更高）
        newLink.addEventListener('click', clickHandler, true);
        
        // 子菜单项点击处理
        const childLinks = hasSubmenu.querySelectorAll('a');
        childLinks.forEach(function(childLink) {
          childLink.addEventListener('click', function(e) {
            // 移除所有子菜单的激活状态
            hasSubmenu.querySelectorAll('li').forEach(function(childItem) {
              childItem.classList.remove('active');
            });
            
            // 添加当前子菜单项的激活状态
            this.parentElement.classList.add('active');
            
            // 视觉反馈
            addRippleEffect(this, e);
          });
        });
      } else {
        // 没有子菜单的项目,点击时添加视觉反馈
        link.addEventListener('click', function(e) {
          addRippleEffect(this, e);
        });
        
        // 键盘导航支持
        link.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      }
    });
    
    // 根据当前 URL 设置激活状态
    setActiveMenuByPath(menuItems, currentPath);
    
    console.log('==== Google Cloud菜单初始化完成 ====');
  }
  
  // 设置当前激活菜单
  function setActiveMenuByPath(menuItems, currentPath) {
    menuItems.forEach(function(item) {
      const link = item.querySelector('a');
      const childMenu = item.querySelector('.child_menu');
      
      // 检查主菜单链接
      if (link && link.getAttribute('href') === currentPath) {
        if (!childMenu) {
          item.classList.add('active');
        }
      }
      
      // 检查子菜单链接
      if (childMenu) {
        const childLinks = childMenu.querySelectorAll('a');
        childLinks.forEach(function(childLink) {
          if (childLink.getAttribute('href') === currentPath) {
            item.classList.add('active');
            childLink.parentElement.classList.add('active');
          }
        });
      }
    });
  }
  
  // 添加水波纹效果
  function addRippleEffect(element, event) {
    const ripple = document.createElement('span');
    const rect = element.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = event.clientX - rect.left - size / 2;
    const y = event.clientY - rect.top - size / 2;
    
    ripple.style.cssText = `
      position: absolute;
      width: ${size}px;
      height: ${size}px;
      left: ${x}px;
      top: ${y}px;
      background: rgba(42, 128, 235, 0.3);
      border-radius: 50%;
      pointer-events: none;
      transform: scale(0);
      animation: ripple 0.6s ease-out;
    `;
    
    element.style.position = 'relative';
    element.style.overflow = 'hidden';
    element.appendChild(ripple);
    
    setTimeout(function() {
      ripple.remove();
    }, 600);
  }
  
  // 添加水波纹动画
  const style = document.createElement('style');
  style.textContent = `
    @keyframes ripple {
      to {
        transform: scale(2);
        opacity: 0;
      }
    }
  `;
  document.head.appendChild(style);
  
  // 滚动检测
  function initScrollDetection() {
    const scrollView = document.querySelector('.scroll-view');
    if (!scrollView) return;
    
    scrollView.addEventListener('scroll', function() {
      if (this.scrollTop > 10) {
        this.classList.add('scrolled');
      } else {
        this.classList.remove('scrolled');
      }
    });
  }
  
  // 侧边栏切换动画优化
  function initSidebarToggle() {
    const menuToggle = document.querySelector('#menu_toggle');
    const sidebarCloseBtn = document.querySelector('#sidebar_close');
    if (!menuToggle) return;
    
    // 确保只有一个遮罩层
    let overlay = document.querySelector('.sidebar-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'sidebar-overlay';
      document.body.appendChild(overlay);
    }
    
    // 切换菜单
    function toggleMenu() {
      document.body.classList.toggle('menu-open');
      
      // 菜单打开时禁止页面滚动
      if (document.body.classList.contains('menu-open')) {
        document.body.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
      }
    }
    
    // 打开菜单
    function openMenu() {
      document.body.classList.add('menu-open');
      document.body.style.overflow = 'hidden';
    }
    
    // 关闭菜单
    function closeMenu() {
      document.body.classList.remove('menu-open');
      document.body.style.overflow = '';
    }
    
    // 移除旧的事件监听器（如果存在）
    const newMenuToggle = menuToggle.cloneNode(true);
    menuToggle.parentNode.replaceChild(newMenuToggle, menuToggle);
    
    // 汉堡菜单按钮点击 - 切换
    newMenuToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      toggleMenu();
    });
    
    // 侧边栏关闭按钮点击 - 关闭
    if (sidebarCloseBtn) {
      sidebarCloseBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        closeMenu();
      });
    }
    
    // 遮罩层点击关闭菜单
    overlay.addEventListener('click', function(e) {
      e.preventDefault();
      closeMenu();
    });
    
    // 只对没有子菜单的主菜单项和所有子菜单项添加自动关闭功能
    const menuItems = document.querySelectorAll('.side-menu > li');
    menuItems.forEach(function(item) {
      const link = item.querySelector('a');
      const hasSubmenu = item.querySelector('.child_menu');
      
      if (!hasSubmenu && link && link.getAttribute('href')) {
        // 没有子菜单的主菜单项，点击后关闭侧边栏
        link.addEventListener('click', function(e) {
          if (this.getAttribute('href') && this.getAttribute('href') !== '#' && this.getAttribute('href') !== 'javascript:;') {
            setTimeout(closeMenu, 300);
          }
        });
      }
      
      // 子菜单项点击后关闭侧边栏
      if (hasSubmenu) {
        const childLinks = hasSubmenu.querySelectorAll('a');
        childLinks.forEach(function(childLink) {
          childLink.addEventListener('click', function(e) {
            if (this.getAttribute('href') && this.getAttribute('href') !== '#' && this.getAttribute('href') !== 'javascript:;') {
              setTimeout(closeMenu, 300);
            }
          });
        });
      }
    });
  }
  
  // 响应式处理
  function initResponsive() {
    const handleResize = function() {
      // 窗口调整时关闭菜单（所有尺寸下都默认隐藏）
      const isMenuOpen = document.body.classList.contains('menu-open');
      // 如果正在调整窗口大小且菜单打开，可选择保持打开或关闭
      // 这里我们选择在窗口大小变化时保持当前状态
    };
    
    window.addEventListener('resize', handleResize);
  }
  
  // 键盘快捷键
  function initKeyboardShortcuts() {
    document.addEventListener('keydown', function(e) {
      // Alt + M 切换菜单
      if (e.altKey && e.key === 'm') {
        e.preventDefault();
        const menuToggle = document.querySelector('#menu_toggle');
        if (menuToggle) {
          menuToggle.click();
        }
      }
      
      // Esc 关闭菜单或展开的子菜单
      if (e.key === 'Escape') {
        const isMenuOpen = document.body.classList.contains('menu-open');
        
        if (isMenuOpen) {
          // 关闭整个菜单
          document.body.classList.remove('menu-open');
          document.body.style.overflow = '';
        } else {
          // 关闭展开的子菜单
          const activeMenus = document.querySelectorAll('.side-menu > li.active');
          activeMenus.forEach(function(menu) {
            if (menu.querySelector('.child_menu')) {
              menu.classList.remove('active');
            }
          });
        }
      }
    });
  }
  
  // 初始化所有功能
  function initAll() {
    // 先禁用旧的侧边栏逻辑
    disableOldSidebarLogic();
    preventNavSmClass();
    
    // 初始化新的功能
    initGoogleCloudMenu();
    initScrollDetection();
    initSidebarToggle();
    initResponsive();
    initKeyboardShortcuts();
    
    // 确保在 custom.js 加载后再次禁用旧逻辑并重新初始化
    setTimeout(function() {
      disableOldSidebarLogic();
      // 重新初始化菜单交互，确保事件绑定正确
      initGoogleCloudMenu();
    }, 100);
    
    // 更长延迟再次确保（处理慢加载情况）
    setTimeout(function() {
      disableOldSidebarLogic();
      initGoogleCloudMenu();
    }, 500);
  }
  
  // 启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
  
  // 页面完全加载后再次确保
  window.addEventListener('load', function() {
    disableOldSidebarLogic();
    initGoogleCloudMenu();
  });
})();
</script>
