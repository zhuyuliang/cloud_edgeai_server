version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eaihub_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 你的数据库密码
      MYSQL_DATABASE: eaihub
      MYSQL_USER: eaihub_user
      MYSQL_PASSWORD: 你的数据库密码
    ports:
      - "5456:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - eaihub_network

volumes:
  mysql_data:
    driver: local

networks:
  eaihub_network:
    driver: bridge

